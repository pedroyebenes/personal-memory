<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!--
    Border-image frame for the illuminated manuscript theme.
    Sliced at 100px from each side → 9 regions:
      Corners:      TL(0,0)–(100,100)  TR(200,0)–(300,100)
                    BL(0,200)–(100,300) BR(200,200)–(300,300)
      Horizontal:   Top(100,0)–(200,100)   Bottom(100,200)–(200,300)
      Vertical:     Left(0,100)–(100,200)  Right(200,100)–(300,200)
      Center:       (100,100)–(200,200) — not rendered by border-image
  -->

  <!-- ═══ FRAME FILL (warm parchment) ═══ -->
  <rect width="300" height="300" fill="#c8a87a"/>

  <!-- ═══ BORDER LINES ═══ -->
  <rect x="1.5" y="1.5" width="297" height="297" fill="none" stroke="#2a1508" stroke-width="3"/>
  <rect x="6"   y="6"   width="288" height="288" fill="none" stroke="#c8921a" stroke-width="2"/>
  <rect x="10"  y="10"  width="280" height="280" fill="none" stroke="#2a1508" stroke-width="1.5"/>
  <!-- inner lines (near the content boundary at 100px) -->
  <rect x="90"  y="90"  width="120" height="120" fill="none" stroke="#c8921a" stroke-width="2"/>
  <rect x="94"  y="94"  width="112" height="112" fill="none" stroke="#2a1508" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       TOP EDGE VINE  (x=100–200, y=0–100)
       vine centre y=50; starts/ends at y=50
  ═══════════════════════════════════════════ -->
  <path d="M100,50 C112,28 128,72 150,50 C172,28 188,72 200,50"
        stroke="#6b3d1a" stroke-width="2.2" fill="none"/>
  <!-- leaves -->
  <ellipse cx="121" cy="37" rx="13" ry="5" fill="#245c1e" opacity="0.9" transform="rotate(-28 121 37)"/>
  <ellipse cx="138" cy="63" rx="13" ry="5" fill="#1a5228" opacity="0.9" transform="rotate(22 138 63)"/>
  <ellipse cx="163" cy="37" rx="13" ry="5" fill="#245c1e" opacity="0.9" transform="rotate(-22 163 37)"/>
  <ellipse cx="179" cy="63" rx="11" ry="4" fill="#1a5228" opacity="0.85" transform="rotate(28 179 63)"/>
  <!-- tendrils -->
  <path d="M126,43 C119,35 113,38 116,44" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <path d="M174,57 C181,65 187,62 184,56" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <!-- centre flower -->
  <circle cx="150" cy="50" r="6"   fill="#d4a020"/>
  <circle cx="150" cy="50" r="3.5" fill="#a07010"/>
  <!-- birds in flight (V shapes) -->
  <path d="M113,22 L115,27 L117,22" stroke="#2a1508" stroke-width="1.3" fill="none" opacity="0.75"/>
  <path d="M183,18 L185,23 L187,18" stroke="#2a1508" stroke-width="1.3" fill="none" opacity="0.75"/>
  <!-- small berries -->
  <circle cx="130" cy="50" r="2.5" fill="#8b2010" opacity="0.8"/>
  <circle cx="170" cy="50" r="2.5" fill="#8b2010" opacity="0.8"/>

  <!-- ═══════════════════════════════════════════
       BOTTOM EDGE VINE  (x=100–200, y=200–300)
  ═══════════════════════════════════════════ -->
  <path d="M100,250 C112,228 128,272 150,250 C172,228 188,272 200,250"
        stroke="#6b3d1a" stroke-width="2.2" fill="none"/>
  <ellipse cx="121" cy="237" rx="13" ry="5" fill="#245c1e" opacity="0.9" transform="rotate(-28 121 237)"/>
  <ellipse cx="138" cy="263" rx="13" ry="5" fill="#1a5228" opacity="0.9" transform="rotate(22 138 263)"/>
  <ellipse cx="163" cy="237" rx="13" ry="5" fill="#245c1e" opacity="0.9" transform="rotate(-22 163 237)"/>
  <ellipse cx="179" cy="263" rx="11" ry="4" fill="#1a5228" opacity="0.85" transform="rotate(28 179 263)"/>
  <path d="M126,243 C119,235 113,238 116,244" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <path d="M174,257 C181,265 187,262 184,256" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <circle cx="150" cy="250" r="6"   fill="#d4a020"/>
  <circle cx="150" cy="250" r="3.5" fill="#a07010"/>
  <path d="M113,278 L115,273 L117,278" stroke="#2a1508" stroke-width="1.3" fill="none" opacity="0.75"/>
  <path d="M183,282 L185,277 L187,282" stroke="#2a1508" stroke-width="1.3" fill="none" opacity="0.75"/>
  <circle cx="130" cy="250" r="2.5" fill="#8b2010" opacity="0.8"/>
  <circle cx="170" cy="250" r="2.5" fill="#8b2010" opacity="0.8"/>

  <!-- ═══════════════════════════════════════════
       LEFT EDGE VINE  (x=0–100, y=100–200)
       vine centre x=50; starts/ends at x=50
  ═══════════════════════════════════════════ -->
  <path d="M50,100 C28,112 72,128 50,150 C28,172 72,188 50,200"
        stroke="#6b3d1a" stroke-width="2.2" fill="none"/>
  <ellipse cx="37" cy="121" rx="5" ry="13" fill="#245c1e" opacity="0.9" transform="rotate(-28 37 121)"/>
  <ellipse cx="63" cy="138" rx="5" ry="13" fill="#1a5228" opacity="0.9" transform="rotate(22 63 138)"/>
  <ellipse cx="37" cy="163" rx="5" ry="13" fill="#245c1e" opacity="0.9" transform="rotate(-22 37 163)"/>
  <ellipse cx="63" cy="179" rx="4" ry="11" fill="#1a5228" opacity="0.85" transform="rotate(28 63 179)"/>
  <path d="M43,126 C35,119 38,113 44,116" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <path d="M57,174 C65,181 62,187 56,184" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <circle cx="50" cy="150" r="6"   fill="#d4a020"/>
  <circle cx="50" cy="150" r="3.5" fill="#a07010"/>
  <circle cx="50" cy="130" r="2.5" fill="#8b2010" opacity="0.8"/>
  <circle cx="50" cy="170" r="2.5" fill="#8b2010" opacity="0.8"/>

  <!-- ═══════════════════════════════════════════
       RIGHT EDGE VINE  (x=200–300, y=100–200)
  ═══════════════════════════════════════════ -->
  <path d="M250,100 C228,112 272,128 250,150 C228,172 272,188 250,200"
        stroke="#6b3d1a" stroke-width="2.2" fill="none"/>
  <ellipse cx="237" cy="121" rx="5" ry="13" fill="#245c1e" opacity="0.9" transform="rotate(-28 237 121)"/>
  <ellipse cx="263" cy="138" rx="5" ry="13" fill="#1a5228" opacity="0.9" transform="rotate(22 263 138)"/>
  <ellipse cx="237" cy="163" rx="5" ry="13" fill="#245c1e" opacity="0.9" transform="rotate(-22 237 163)"/>
  <ellipse cx="263" cy="179" rx="4" ry="11" fill="#1a5228" opacity="0.85" transform="rotate(28 263 179)"/>
  <path d="M243,126 C235,119 238,113 244,116" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <path d="M257,174 C265,181 262,187 256,184" stroke="#6b3d1a" stroke-width="1" fill="none"/>
  <circle cx="250" cy="150" r="6"   fill="#d4a020"/>
  <circle cx="250" cy="150" r="3.5" fill="#a07010"/>
  <circle cx="250" cy="130" r="2.5" fill="#8b2010" opacity="0.8"/>
  <circle cx="250" cy="170" r="2.5" fill="#8b2010" opacity="0.8"/>

  <!-- ═══════════════════════════════════════════
       CORNER MEDALLIONS — 8-petal rose + gold centre
  ═══════════════════════════════════════════ -->

  <!-- TL — centre (50,50) -->
  <circle cx="50" cy="50" r="44" fill="#b89050" opacity="0.22"/>
  <circle cx="50" cy="50" r="40" fill="#c8a87a"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#c8921a" stroke-width="1.5"/>
  <!-- cardinal petals (forest green) -->
  <ellipse cx="50" cy="20" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="50" cy="80" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="20" cy="50" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <ellipse cx="80" cy="50" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <!-- diagonal petals (deep red/burgundy) -->
  <ellipse cx="29" cy="29" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 29 29)"/>
  <ellipse cx="71" cy="29" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 71 29)"/>
  <ellipse cx="29" cy="71" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 29 71)"/>
  <ellipse cx="71" cy="71" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 71 71)"/>
  <!-- gold ring -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#c8921a" stroke-width="2"/>
  <!-- centre medallion -->
  <circle cx="50" cy="50" r="14" fill="#c8921a"/>
  <circle cx="50" cy="50" r="10" fill="#ddc848"/>
  <circle cx="50" cy="50" r="6"  fill="#c8921a"/>
  <circle cx="50" cy="50" r="3"  fill="#ddc848"/>

  <!-- TR — centre (250,50) -->
  <circle cx="250" cy="50" r="44" fill="#b89050" opacity="0.22"/>
  <circle cx="250" cy="50" r="40" fill="#c8a87a"/>
  <circle cx="250" cy="50" r="38" fill="none" stroke="#c8921a" stroke-width="1.5"/>
  <ellipse cx="250" cy="20" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="250" cy="80" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="220" cy="50" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <ellipse cx="280" cy="50" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <ellipse cx="229" cy="29" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 229 29)"/>
  <ellipse cx="271" cy="29" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 271 29)"/>
  <ellipse cx="229" cy="71" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 229 71)"/>
  <ellipse cx="271" cy="71" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 271 71)"/>
  <circle cx="250" cy="50" r="20" fill="none" stroke="#c8921a" stroke-width="2"/>
  <circle cx="250" cy="50" r="14" fill="#c8921a"/>
  <circle cx="250" cy="50" r="10" fill="#ddc848"/>
  <circle cx="250" cy="50" r="6"  fill="#c8921a"/>
  <circle cx="250" cy="50" r="3"  fill="#ddc848"/>

  <!-- BL — centre (50,250) -->
  <circle cx="50" cy="250" r="44" fill="#b89050" opacity="0.22"/>
  <circle cx="50" cy="250" r="40" fill="#c8a87a"/>
  <circle cx="50" cy="250" r="38" fill="none" stroke="#c8921a" stroke-width="1.5"/>
  <ellipse cx="50" cy="220" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="50" cy="280" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="20" cy="250" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <ellipse cx="80" cy="250" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <ellipse cx="29" cy="229" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 29 229)"/>
  <ellipse cx="71" cy="229" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 71 229)"/>
  <ellipse cx="29" cy="271" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 29 271)"/>
  <ellipse cx="71" cy="271" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 71 271)"/>
  <circle cx="50" cy="250" r="20" fill="none" stroke="#c8921a" stroke-width="2"/>
  <circle cx="50" cy="250" r="14" fill="#c8921a"/>
  <circle cx="50" cy="250" r="10" fill="#ddc848"/>
  <circle cx="50" cy="250" r="6"  fill="#c8921a"/>
  <circle cx="50" cy="250" r="3"  fill="#ddc848"/>

  <!-- BR — centre (250,250) -->
  <circle cx="250" cy="250" r="44" fill="#b89050" opacity="0.22"/>
  <circle cx="250" cy="250" r="40" fill="#c8a87a"/>
  <circle cx="250" cy="250" r="38" fill="none" stroke="#c8921a" stroke-width="1.5"/>
  <ellipse cx="250" cy="220" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="250" cy="280" rx="8"  ry="18" fill="#245c1e" opacity="0.88"/>
  <ellipse cx="220" cy="250" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <ellipse cx="280" cy="250" rx="18" ry="8"  fill="#245c1e" opacity="0.88"/>
  <ellipse cx="229" cy="229" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 229 229)"/>
  <ellipse cx="271" cy="229" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 271 229)"/>
  <ellipse cx="229" cy="271" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate( 45 229 271)"/>
  <ellipse cx="271" cy="271" rx="8" ry="16" fill="#7a1c10" opacity="0.78" transform="rotate(-45 271 271)"/>
  <circle cx="250" cy="250" r="20" fill="none" stroke="#c8921a" stroke-width="2"/>
  <circle cx="250" cy="250" r="14" fill="#c8921a"/>
  <circle cx="250" cy="250" r="10" fill="#ddc848"/>
  <circle cx="250" cy="250" r="6"  fill="#c8921a"/>
  <circle cx="250" cy="250" r="3"  fill="#ddc848"/>
</svg>
