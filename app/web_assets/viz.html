<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embedding Space — Personal Memory</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #12121f; color: #d8d8e8; font-family: Georgia, serif; overflow: hidden; }

    #canvas-container { position: fixed; inset: 0; }
    #canvas-container > div { pointer-events: none; } /* CSS2D overlay */

    /* ── Floating labels ── */
    .point-label {
      font-family: Georgia, serif;
      font-size: 11px;
      line-height: 1.3;
      color: #f0f0ff;
      background: rgba(8, 8, 22, 0.7);
      border: 1px solid rgba(255,255,255,0.09);
      padding: 2px 7px 3px;
      border-radius: 4px;
      white-space: nowrap;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      user-select: none;
      backdrop-filter: blur(3px);
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed; top: 0; left: 0;
      width: 248px; height: 100vh;
      background: rgba(12, 12, 26, 0.9);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255,255,255,0.07);
      display: flex; flex-direction: column;
      z-index: 10; overflow: hidden;
    }

    #sidebar-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    #sidebar-header h1 { font-size: 0.95rem; font-weight: normal; color: #9ecfb8; margin-bottom: 2px; }
    .back { font-size: 0.75rem; color: #555; text-decoration: none; display: inline-block; margin-bottom: 12px; }
    .back:hover { color: #9ecfb8; }
    .meta-row { font-size: 0.75rem; color: #777; margin-bottom: 3px; }
    .meta-row strong { color: #ccc; }

    #sidebar-controls {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .ctrl { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #aaa; margin-bottom: 10px; user-select: none; }
    .ctrl:last-child { margin-bottom: 0; }
    .ctrl input[type=checkbox] { cursor: pointer; accent-color: #9ecfb8; }
    .ctrl input[type=range]    { flex: 1; cursor: pointer; accent-color: #9ecfb8; }
    .ctrl label { cursor: pointer; }
    .note { font-size: 0.7rem; color: #444; margin-top: 8px; line-height: 1.5; }

    /* ── Cluster legend ── */
    #sidebar-legend { flex: 1; overflow-y: auto; padding: 14px 18px; }
    .legend-heading { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: #555; margin-bottom: 8px; }
    #legend-list { display: flex; flex-direction: column; gap: 4px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.73rem; color: #bbb; padding: 3px 6px; border-radius: 4px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; max-width: 300px;
      background: rgba(10, 10, 24, 0.96);
      border: 1px solid rgba(158, 207, 184, 0.3);
      border-radius: 7px; padding: 11px 14px;
      font-size: 0.78rem; pointer-events: none; z-index: 30;
      display: none; line-height: 1.5;
    }
    .tt-concept { font-size: 0.88rem; color: #fff; margin-bottom: 4px; }
    .tt-doc     { font-size: 0.72rem; color: #666; margin-bottom: 7px; }
    .tt-text    { color: #b8b8cc; }

    /* ── Overlays ── */
    .overlay {
      position: fixed; inset: 0; background: #12121f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; gap: 12px; font-size: 0.9rem;
    }
    #loading { color: #9ecfb8; }
    #loading .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(158,207,184,0.2);
      border-top-color: #9ecfb8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-screen { color: #e07878; display: none; text-align: center; padding: 40px; }
  </style>
</head>
<body>

<div id="loading" class="overlay">
  <div class="spinner"></div>
  <span>Computing clusters &amp; projection…</span>
</div>
<div id="error-screen" class="overlay">
  <p id="error-msg"></p>
</div>

<div id="canvas-container"></div>

<div id="sidebar">
  <div id="sidebar-header">
    <a class="back" href="/">← Chat</a>
    <h1>Embedding Space</h1>
    <div class="meta-row" id="meta-chunks"></div>
    <div class="meta-row" id="meta-clusters"></div>
    <div class="meta-row" id="meta-variance"></div>
  </div>

  <div id="sidebar-controls">
    <div class="ctrl">
      <label><input type="checkbox" id="auto-rotate" checked> Auto-rotate</label>
    </div>
    <div class="ctrl">
      <label><input type="checkbox" id="show-edges" checked> Show connections</label>
    </div>
    <div class="ctrl">
      <span style="white-space:nowrap">Labels</span>
      <input type="range" id="label-count" min="0" max="60" value="20">
    </div>
    <div class="ctrl">
      <span style="white-space:nowrap">Point size</span>
      <input type="range" id="point-size" min="1" max="16" value="5">
    </div>
    <p class="note">Orbit to explore — labels follow your focus point.</p>
  </div>

  <div id="sidebar-legend">
    <div class="legend-heading">Clusters</div>
    <div id="legend-list"></div>
  </div>
</div>

<div id="tooltip">
  <div class="tt-concept" id="tt-concept"></div>
  <div class="tt-doc"     id="tt-doc"></div>
  <div class="tt-text"    id="tt-text"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }              from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// 20-color palette for clusters
const PALETTE = [
  '#e05c7a','#4fc3a1','#f6a623','#7b9fd4','#c47bc1',
  '#80c770','#f0886a','#5dbcd2','#d4af37','#9b8eb8',
  '#e8834e','#52b8d8','#76b9a6','#b8cc6c','#d47da9',
  '#6a9fc0','#e0a060','#8a7fc8','#68c890','#d06060',
];

function clusterColor(id) { return PALETTE[id % PALETTE.length]; }

function conceptName(p) {
  if (p.section_title?.trim()) return p.section_title.trim();
  const words = p.snippet.trim().split(/\s+/);
  return words.slice(0, 6).join(' ') + (words.length > 6 ? '…' : '');
}

// ── Globals ────────────────────────────────────────────────────
let scene, camera, renderer, labelRenderer, controls;
let pointsMesh, edgeLines;
let vizData = null;
let labelObjects = [];      // { obj: CSS2DObject, vec: THREE.Vector3 }
let visibleSet = new Set();
let maxLabels = 20;
let frameIdx = 0;
const _tmp = new THREE.Vector3();

// ── Main ───────────────────────────────────────────────────────
async function main() {
  let res;
  try { res = await fetch('/api/viz'); }
  catch (e) { showError('Could not reach server: ' + e.message); return; }

  const data = await res.json();
  if (!data.ok) { showError(data.error?.message || 'Failed to load data.'); return; }
  vizData = data;

  document.getElementById('meta-chunks').innerHTML =
    `<strong>${data.points.length.toLocaleString()}</strong> concepts`;
  document.getElementById('meta-clusters').innerHTML =
    `<strong>${data.n_clusters}</strong> clusters`;
  if (data.variance_explained?.length) {
    const pct = data.variance_explained.slice(0, 3).map(v => (v * 100).toFixed(1) + '%').join(' + ');
    document.getElementById('meta-variance').innerHTML = `PCA variance: ${pct}`;
  }

  setupScene();
  buildPoints(data.points);
  buildEdges(data.points, data.edges);
  buildLabels(data.points);
  buildLegend(data.n_clusters);
  setupHover(data.points);
  setupUIControls();

  document.getElementById('loading').style.display = 'none';
  animate();
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-screen').style.display = 'flex';
}

// ── Scene ──────────────────────────────────────────────────────
function setupScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x12121f);
  scene.fog = new THREE.FogExp2(0x12121f, 0.05);

  const w = window.innerWidth, h = window.innerHeight;

  camera = new THREE.PerspectiveCamera(55, w / h, 0.01, 120);
  camera.position.set(0, 0, 3.8);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);

  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(w, h);
  Object.assign(labelRenderer.domElement.style, {
    position: 'absolute', top: '0', left: '0', pointerEvents: 'none',
  });

  const container = document.getElementById('canvas-container');
  container.appendChild(renderer.domElement);
  container.appendChild(labelRenderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;

  // Faint axis lines
  const axisMat = new THREE.LineBasicMaterial({ color: 0x222240, transparent: true, opacity: 0.5 });
  [[-1.5,0,0],[1.5,0,0],[0,-1.5,0],[0,1.5,0],[0,0,-1.5],[0,0,1.5]].reduce((acc, v, i) => {
    if (i % 2 === 0) { acc.push(v); } else {
      const geo = new THREE.BufferGeometry().setFromPoints(
        [new THREE.Vector3(...acc.pop()), new THREE.Vector3(...v)]
      );
      scene.add(new THREE.Line(geo, axisMat));
    }
    return acc;
  }, []);

  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    labelRenderer.setSize(w, h);
  });
}

// ── Points (vertex-colored by cluster) ────────────────────────
function buildPoints(points) {
  const positions = new Float32Array(points.length * 3);
  const colors    = new Float32Array(points.length * 3);
  const col = new THREE.Color();

  points.forEach((p, i) => {
    positions[i*3]   = p.x; positions[i*3+1] = p.y; positions[i*3+2] = p.z;
    col.set(clusterColor(p.cluster_id));
    colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
  });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

  pointsMesh = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.045, vertexColors: true,
    sizeAttenuation: true, transparent: true, opacity: 0.9,
  }));
  scene.add(pointsMesh);
}

// ── Edges (gradient between cluster colors) ────────────────────
function buildEdges(points, edges) {
  const positions = new Float32Array(edges.length * 6);
  const colors    = new Float32Array(edges.length * 6);
  const colA = new THREE.Color(), colB = new THREE.Color();

  edges.forEach(([i, j], e) => {
    const pi = points[i], pj = points[j];
    positions[e*6]   = pi.x; positions[e*6+1] = pi.y; positions[e*6+2] = pi.z;
    positions[e*6+3] = pj.x; positions[e*6+4] = pj.y; positions[e*6+5] = pj.z;

    colA.set(clusterColor(pi.cluster_id));
    colB.set(clusterColor(pj.cluster_id));
    colors[e*6]   = colA.r; colors[e*6+1] = colA.g; colors[e*6+2] = colA.b;
    colors[e*6+3] = colB.r; colors[e*6+4] = colB.g; colors[e*6+5] = colB.b;
  });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

  edgeLines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.18,
  }));
  scene.add(edgeLines);
}

// ── Labels ─────────────────────────────────────────────────────
function buildLabels(points) {
  labelObjects = points.map(p => {
    const div = document.createElement('div');
    div.className = 'point-label';
    div.textContent = conceptName(p);

    const obj = new CSS2DObject(div);
    obj.position.set(p.x, p.y, p.z);
    return { obj, vec: new THREE.Vector3(p.x, p.y, p.z) };
  });
}

function refreshLabels(force = false) {
  if (!force && frameIdx % 8 !== 0) return;

  const target = controls.target;
  const nearest = labelObjects
    .map((l, i) => ({ i, d: _tmp.copy(l.vec).distanceTo(target) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, maxLabels);

  const next = new Set(nearest.map(x => x.i));

  for (const idx of visibleSet) {
    if (!next.has(idx)) scene.remove(labelObjects[idx].obj);
  }
  for (const idx of next) {
    if (!visibleSet.has(idx)) scene.add(labelObjects[idx].obj);
  }

  visibleSet = next;
}

// ── Cluster legend ─────────────────────────────────────────────
function buildLegend(n) {
  const list = document.getElementById('legend-list');
  for (let i = 0; i < n; i++) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <div class="legend-swatch" style="background:${clusterColor(i)}"></div>
      <span>Cluster ${i + 1}</span>
    `;
    list.appendChild(item);
  }
}

// ── Hover tooltip ──────────────────────────────────────────────
function setupHover(points) {
  const raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 0.04;
  const mouse = new THREE.Vector2(-9, -9);
  const tooltip = document.getElementById('tooltip');
  let pending = null;

  renderer.domElement.addEventListener('mousemove', e => {
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    if (pending) clearTimeout(pending);
    pending = setTimeout(() => {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(pointsMesh);
      if (hits.length > 0) {
        const p = points[hits[0].index];
        document.getElementById('tt-concept').textContent = conceptName(p);
        document.getElementById('tt-doc').textContent = p.document_title;
        document.getElementById('tt-text').textContent = p.snippet;
        tooltip.style.left    = Math.min(e.clientX + 16, window.innerWidth  - 320) + 'px';
        tooltip.style.top     = Math.min(e.clientY + 16, window.innerHeight - 180) + 'px';
        tooltip.style.display = 'block';
      } else {
        tooltip.style.display = 'none';
      }
    }, 35);
  });

  renderer.domElement.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

// ── UI controls ────────────────────────────────────────────────
function setupUIControls() {
  document.getElementById('auto-rotate').addEventListener('change', e => {
    controls.autoRotate = e.target.checked;
  });
  document.getElementById('show-edges').addEventListener('change', e => {
    if (edgeLines) edgeLines.visible = e.target.checked;
  });
  document.getElementById('label-count').addEventListener('input', e => {
    maxLabels = parseInt(e.target.value, 10);
    refreshLabels(true);
  });
  document.getElementById('point-size').addEventListener('input', e => {
    if (pointsMesh) pointsMesh.material.size = parseFloat(e.target.value) * 0.009;
  });
}

// ── Render loop ────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  refreshLabels();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  frameIdx++;
}

main();
</script>
</body>
</html>
