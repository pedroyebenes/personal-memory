<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Memory</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/static/styles/tokens.css">
  <link rel="stylesheet" href="/static/styles/base.css">
  <link rel="stylesheet" href="/static/styles/shell.css">
  <link rel="stylesheet" href="/static/styles/components.css">
  <link rel="stylesheet" href="/static/styles/manuscript.css">
  <script>
    // Apply the saved theme synchronously to avoid a flash. Mirrors the
    // storage key used by lib/storage.js (pm-v2/pref/theme) and lib/theme.js.
    (function () {
      try {
        var raw = localStorage.getItem("pm-v2/pref/theme");
        var t = raw ? JSON.parse(raw) : "dark";
        if (t !== "dark" && t !== "light" && t !== "manuscript") t = "dark";
        document.documentElement.dataset.theme = t;
        document.body && (document.body.dataset.theme = t);
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app" class="pm-app">
    <header class="pm-header" id="pm-header"></header>
    <main class="pm-main" id="view-mount" tabindex="-1"></main>
  </div>
  <script type="module" src="/static/shell/main.js"></script>
</body>
</html>
