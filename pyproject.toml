[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory"
version = "0.1.0"
description = "Local-first personal memory system for Obsidian Markdown vaults"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "sentence-transformers>=3.0.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.6",
  "hdbscan>=0.8.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
  "sqlite-vec>=0.1.6",
]
vec = [
  "sqlite-vec>=0.1.6",
]

[project.scripts]
personal-memory = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.package-data]
app = ["schema.sql", "web_assets/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F"]
